<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Markdown Viewer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #cherry-markdown {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #cherry-markdown {
        flex: 1 1 auto;
        min-height: 0;
      }
      #viewer-status {
        display: none;
        flex: 0 0 auto;
        padding: 4px 8px;
        color: #b00020;
        background: #fff0f0;
        border-top: 1px solid #e0b0b0;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="cherry-markdown"></div>
    <div id="viewer-status" role="status"></div>
    <script src="scripts/markdown-viewer.js"></script>
  </body>
</html>
