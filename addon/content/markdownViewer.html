<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Markdown Viewer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #cherry-markdown {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #cherry-markdown {
        flex: 1 1 auto;
        min-height: 0;
      }
      #viewer-status {
        display: none;
        flex: 0 0 auto;
        padding: 4px 8px;
        color: #b00020;
        background: #fff0f0;
        border-top: 1px solid #e0b0b0;
        font-size: 12px;
      }
      @media (prefers-color-scheme: dark) {
        #viewer-status {
          color: #ffb4ab;
          background: #3b2020;
          border-color: #6b4040;
        }
      }
    </style>
  </head>
  <body>
    <div id="cherry-markdown"></div>
    <div id="viewer-status" role="status"></div>
    <script src="scripts/markdown-viewer.js"></script>
  </body>
</html>
